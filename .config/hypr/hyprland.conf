source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/autostart.conf
$mainMod = SUPER

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faee)
    col.inactive_border = rgba(313244aa)
}

decoration {
    rounding = 10
    blur {
        enabled = true
    }
}

animations {
    enabled = true
}

input {
    kb_layout = pl

    touchpad {
        natural_scroll = true
    }
}

gestures {
    gesture = 3, horizontal, workspace
}
